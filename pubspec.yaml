name: holy_quran
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev



version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  # কোর ফাংশনালিটি
  adhan: ^2.0.0+1
  geolocator: ^10.1.0
  intl: ^0.18.0
  http: ^1.2.0

  # লোকাল ডাটাবেস ও স্টোরেজ
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2  # এখানে অতিরিক্ত টেক্সট সরানো হয়েছে

  # অডিও এবং স্টেট ম্যানেজমেন্ট
  connectivity_plus: ^6.1.0
  just_audio: ^0.9.36
  provider: ^6.1.5+1

  # শেয়ারিং ফিচার
  share_plus: ^10.1.4
  #payment gateway open
  url_launcher: ^6.1.14
  webview_flutter: ^4.4.2
  flutter_dotenv: ^5.1.0
  in_app_review: ^2.0.0
  package_info_plus: ^4.0.0





  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter



  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/final_background.jpg
    - assets/images/bismillah.png
    - assets/images/compass_dial.png
    - assets/images/qibla_needle.png
    - assets/images/surah_icon_image.png
    - assets/images/home_screen_background_image.jpg
    - assets/images/surah_detail_screen_background_image.jpg
    # শুধুমাত্র ফোল্ডার পাথ দিলে অনেক সময় সব ফাইল পায় না, তাই মেইন ফাইলগুলো এভাবে দিন
    - assets/data/quran_arabic.json
    - assets/data/en_quran.json
    - assets/data/bn_quran.json
    - assets/data/es_quran.json
    - assets/data/fr_quran.json
    - assets/data/id_quran.json
    - assets/data/ru_quran.json
    - assets/data/sv_quran.json
    - assets/data/tr_quran.json
    - assets/data/ur_quran.json
    - assets/data/zh_quran.json

    # sounds
    - assets/sounds/click.ogg      # ওজিজি ফরম্যাট
    - assets/sounds/complete.wav   # ওয়েভ ফরম্যাট

  fonts:
    - family: QuranFont
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf

    - family: Translation
      fonts:
        - asset: assets/fonts/Roboto-bold.ttf
